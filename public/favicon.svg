<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#f97316" flood-opacity="0.7"/>
    </filter>
  </defs>
  
  <!-- Bordered square container matching navbar brand -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="#0d1322" stroke="url(#borderGrad)" stroke-width="4.5"/>
  
  <!-- JQ Monogram text with vibrant neon glow -->
  <text 
    x="32" 
    y="42" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', 'Space Grotesk', sans-serif" 
    font-size="27" 
    font-weight="900" 
    fill="#f97316" 
    text-anchor="middle" 
    letter-spacing="0.5"
    filter="url(#glow)"
  >JQ</text>
</svg>
